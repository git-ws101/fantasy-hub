<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Intel</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #172033;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
    --none: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 48px 24px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { margin-bottom: 8px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; }
  h1 .dot { color: var(--accent); }
  .back { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
  .back:hover { color: var(--accent); }
  .tagline { color: var(--muted); margin-bottom: 8px; font-size: 0.95rem; }
  .meta { color: var(--none); font-size: 0.8rem; margin-bottom: 28px; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px;
    margin-bottom: 32px;
  }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .tile .label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 600; margin-bottom: 8px;
  }
  .tile .value { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .tile .sub { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .mgr {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .mgr.gone { opacity: 0.55; }
  .mgr-head { display: flex; align-items: center; gap: 12px; }
  .mgr-head img, .mgr-head .noavatar {
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-weight: 700; flex: none;
  }
  .mgr-head .who { min-width: 0; }
  .mgr-head .name { font-weight: 700; font-size: 1rem; }
  .mgr-head .team { color: var(--muted); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mgr-head .rec { margin-left: auto; text-align: right; flex: none; }
  .mgr-head .rec .wl { font-weight: 700; font-variant-numeric: tabular-nums; }
  .mgr-head .rec .pf { color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; }
  .tag {
    font-size: 0.72rem; font-weight: 600; padding: 2px 9px;
    border-radius: 999px; border: 1px solid var(--border); color: var(--muted);
  }
  .tag.hot  { color: var(--warn); border-color: var(--warn); }
  .tag.cold { color: var(--accent); }
  .tag.win  { color: var(--ok); border-color: var(--ok); }

  .faab .row1 {
    display: flex; justify-content: space-between; font-size: 0.8rem;
    color: var(--muted); margin-bottom: 6px;
  }
  .faab .row1 b { color: var(--text); font-variant-numeric: tabular-nums; }
  .faab .track { height: 8px; background: var(--panel-2); border-radius: 4px; position: relative; overflow: hidden; }
  .faab .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; min-width: 2px; }

  .stats { display: flex; gap: 16px; font-size: 0.8rem; color: var(--muted); flex-wrap: wrap; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }

  .bids { font-size: 0.78rem; color: var(--muted); border-top: 1px solid var(--panel-2); padding-top: 10px; }
  .bids .b { display: flex; justify-content: space-between; gap: 8px; margin-top: 3px; }
  .bids .b .amt { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
  .bids .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
  .gone-note { color: var(--none); font-size: 0.75rem; font-style: italic; }

  .error-state {
    background: var(--panel); border: 1px dashed var(--border); border-radius: 10px;
    padding: 24px; color: var(--muted); font-size: 0.9rem;
  }
  footer { margin-top: 40px; color: var(--none); font-size: 0.78rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>League Intel<span class="dot">.</span></h1>
    <a class="back" href="../">&larr; hub</a>
  </header>
  <p class="tagline" id="tagline">Manager-by-manager scouting report, built from last season's Sleeper data.</p>
  <p class="meta" id="meta">loading&hellip;</p>

  <div id="content"></div>

  <footer>Records, FAAB, and activity from the Sleeper API &middot; refreshed daily by GitHub Actions.</footer>
</div>

<script>
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt = n => Number(n).toLocaleString();

  const HOT_TAGS = new Set(["big FAAB spender", "haymaker bids", "spends early"]);
  const WIN_TAGS = new Set(["contender"]);

  function tagClass(t) {
    if (WIN_TAGS.has(t)) return "tag win";
    if (HOT_TAGS.has(t)) return "tag hot";
    return "tag";
  }

  function render(d) {
    if (d.status !== "ok") {
      document.getElementById("meta").textContent = "";
      document.getElementById("content").innerHTML =
        `<div class="error-state">League data isn't available yet (${esc(d.detail || "no successful refresh")}). It will appear after the next data refresh run.</div>`;
      return;
    }

    document.getElementById("meta").textContent =
      `${d.league_name} · ${d.teams}-team · ${d.season} season · ` +
      `analysis from ${d.previous_season} results · updated ${new Date(d.updated).toLocaleString()}`;

    const active = d.managers.filter(m => m.in_current);
    const withFaab = d.managers.filter(m => m.faab.bid_count > 0);
    const totalSpent = withFaab.reduce((a, m) => a + m.faab.spent, 0);
    const biggest = withFaab.reduce((a, m) => m.faab.max_bid > (a?.faab.max_bid || 0) ? m : a, null);
    const trader = d.managers.reduce((a, m) => m.activity.trades > (a?.activity.trades || 0) ? m : a, null);

    const tiles = `
      <div class="tiles">
        <div class="tile"><div class="label">Managers</div><div class="value">${active.length}</div><div class="sub">${d.managers.length - active.length} left since ${d.previous_season}</div></div>
        <div class="tile"><div class="label">FAAB spent ${d.previous_season}</div><div class="value">$${fmt(totalSpent)}</div><div class="sub">of $${fmt((d.faab_budget || 0) * (d.managers.filter(m => m.in_previous).length))} league-wide</div></div>
        <div class="tile"><div class="label">Biggest bid</div><div class="value">$${biggest ? fmt(biggest.faab.max_bid) : 0}</div><div class="sub">${biggest ? esc(biggest.name) : "—"}</div></div>
        <div class="tile"><div class="label">Most trades</div><div class="value">${trader ? trader.activity.trades : 0}</div><div class="sub">${trader ? esc(trader.name) : "—"}</div></div>
      </div>`;

    const cards = d.managers.map(m => {
      const r = m.record;
      const rec = r.wins != null && (r.wins + r.losses) > 0
        ? `${r.wins}-${r.losses}${r.ties ? "-" + r.ties : ""}` : "—";
      const pct = m.faab.budget ? Math.min(100, m.faab.spent / m.faab.budget * 100) : 0;
      const avatar = m.avatar
        ? `<img src="https://sleepercdn.com/avatars/thumbs/${esc(m.avatar)}" alt="">`
        : `<div class="noavatar">${esc((m.name || "?")[0].toUpperCase())}</div>`;
      const bids = m.faab.top_bids.length ? `
        <div class="bids"><span class="label">Biggest waiver swings</span>
          ${m.faab.top_bids.map(b => `<div class="b"><span>${esc(b.player)} <span style="color:var(--none)">wk ${b.week ?? "?"}</span></span><span class="amt">$${fmt(b.bid)}</span></div>`).join("")}
        </div>` : "";
      return `
      <div class="mgr${m.in_current ? "" : " gone"}">
        <div class="mgr-head">
          ${avatar}
          <div class="who">
            <div class="name">${esc(m.name)}</div>
            <div class="team">${esc(m.team_name || "")}</div>
          </div>
          <div class="rec"><div class="wl">${rec}</div><div class="pf">${r.pf ? fmt(r.pf) + " PF" : ""}</div></div>
        </div>
        <div class="tags">${m.tags.map(t => `<span class="${tagClass(t)}">${esc(t)}</span>`).join("")}
          ${m.in_current ? "" : `<span class="gone-note">not in ${esc(d.season)} league</span>`}</div>
        <div class="faab">
          <div class="row1"><span>FAAB ${esc(String(d.previous_season))}</span><span><b>$${fmt(m.faab.spent)}</b> / $${fmt(m.faab.budget || 0)}</span></div>
          <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        </div>
        <div class="stats">
          <span>max bid <b>$${fmt(m.faab.max_bid)}</b></span>
          <span>bids <b>${m.faab.bid_count}</b></span>
          <span>adds <b>${m.activity.adds}</b></span>
          <span>trades <b>${m.activity.trades}</b></span>
        </div>
        ${bids}
      </div>`;
    }).join("");

    document.getElementById("content").innerHTML = tiles + `<div class="cards">${cards}</div>`;
  }

  fetch("../data/league.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(render)
    .catch(err => {
      document.getElementById("meta").textContent = "";
      document.getElementById("content").innerHTML =
        `<div class="error-state">Couldn't load <code>data/league.json</code> (${esc(err.message)}). It's generated by the daily refresh — run <code>python3 scripts/league_refresh.py</code> or trigger the Refresh data workflow.</div>`;
    });
</script>
</body>
</html>
