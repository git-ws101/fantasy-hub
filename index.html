<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walter's Hub</title>
<style>
  :root {
    --bg: #0f172a;          /* slate-900 */
    --panel: #1e293b;       /* slate-800 */
    --panel-2: #172033;
    --border: #334155;      /* slate-700 */
    --text: #e2e8f0;        /* slate-200 */
    --muted: #94a3b8;       /* slate-400 */
    --accent: #38bdf8;      /* sky-400 — single accent */
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
    --none: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 48px 24px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { margin-bottom: 36px; }
  h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; }
  h1 .dot { color: var(--accent); }
  .tagline { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }
  .card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
  .card p { color: var(--muted); font-size: 0.87rem; line-height: 1.45; }
  .card .go { color: var(--accent); font-size: 0.8rem; margin-top: 12px; display: inline-block; }
  .card.empty {
    background: transparent;
    border-style: dashed;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--none);
    font-size: 0.87rem;
    min-height: 130px;
  }

  .status-panel {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .status-panel h3 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .status-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 24px;
    align-items: center;
    font-size: 0.87rem;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 3px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 0.8rem;
    font-weight: 600;
  }
  .badge::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
  }
  .badge.ok   { color: var(--ok); }
  .badge.seed { color: var(--warn); }
  .badge.error{ color: var(--err); }
  .badge.none { color: var(--none); }
  .status-item .label { color: var(--muted); margin-right: 5px; }
  .source-line { color: var(--muted); font-size: 0.8rem; margin-top: 10px; }
  footer { margin-top: 40px; color: var(--none); font-size: 0.78rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="site-title"></h1>
    <p class="tagline">Personal apps and data, served static.</p>
  </header>

  <main>
    <div class="grid">
      <a class="card" href="./draft/">
        <h2>VBD Draft Board</h2>
        <p>Live fantasy draft board with value-based drafting ranks, tiers, and pick tracking.</p>
        <span class="go">Open &rarr;</span>
      </a>
      <div class="card empty">More apps soon</div>
    </div>

    <section class="status-panel">
      <h3>Data pipeline</h3>
      <div class="status-row" id="status-row">
        <span class="badge none" id="status-badge">loading&hellip;</span>
        <span class="status-item"><span class="label">Last refresh</span><span id="status-time">&mdash;</span></span>
        <span class="status-item"><span class="label">Players</span><span id="status-count">&mdash;</span></span>
      </div>
      <p class="source-line" id="source-line"></p>
    </section>
  </main>

  <footer>Static site on GitHub Pages &middot; data refreshed daily by GitHub Actions.</footer>
</div>

<script>
  // ---- Edit the site title here ----
  const SITE_TITLE = "Walter's Hub";
  // ----------------------------------

  document.title = SITE_TITLE;
  document.getElementById("site-title").innerHTML =
    SITE_TITLE.replace(/([.!]?)$/, "") + '<span class="dot">.</span>';

  const badgeEl = document.getElementById("status-badge");
  const timeEl = document.getElementById("status-time");
  const countEl = document.getElementById("status-count");
  const sourceEl = document.getElementById("source-line");

  function setBadge(cls, text) {
    badgeEl.className = "badge " + cls;
    badgeEl.textContent = text;
  }

  async function loadStatus() {
    try {
      const res = await fetch("./data/status.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const s = await res.json();

      const status = String(s.status || "").toLowerCase();
      if (status === "ok") setBadge("ok", "ok");
      else if (status === "seed") setBadge("seed", "seed");
      else if (status === "error") setBadge("error", "error");
      else setBadge("none", status || "unknown");

      if (s.last_run) {
        const d = new Date(s.last_run);
        timeEl.textContent = isNaN(d) ? s.last_run : d.toLocaleString();
      }
      if (s.players != null) countEl.textContent = s.players;
      if (s.detail) badgeEl.title = s.detail;
    } catch (err) {
      setBadge("none", "no status");
    }
  }

  async function loadSource() {
    try {
      const res = await fetch("./data/players.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const p = await res.json();
      if (p.source) sourceEl.textContent = "Source: " + p.source;
    } catch (err) {
      /* leave source line empty */
    }
  }

  loadStatus();
  loadSource();
</script>
</body>
</html>
