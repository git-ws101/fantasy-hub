<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction Desk</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #172033;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
    --none: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 48px 24px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { margin-bottom: 8px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; }
  h1 .dot { color: var(--accent); }
  .back { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
  .back:hover { color: var(--accent); }
  .tagline { color: var(--muted); margin-bottom: 8px; font-size: 0.95rem; }
  .meta { color: var(--none); font-size: 0.8rem; margin-bottom: 28px; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 32px;
  }
  .tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .tile .label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 600; margin-bottom: 8px;
  }
  .tile .value { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }
  .tile .sub { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }

  section { margin-bottom: 36px; }
  section > h3 {
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 600; margin-bottom: 12px;
  }
  .tablewrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
  }
  table { border-collapse: collapse; width: 100%; font-size: 0.87rem; }
  th, td { padding: 10px 14px; text-align: left; white-space: nowrap; }
  th {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  td { border-bottom: 1px solid var(--panel-2); }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--panel-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .event-cell { white-space: normal; min-width: 180px; color: var(--muted); }
  .ticker { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; }
  .stake { font-weight: 700; }

  .chip {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--border); font-size: 0.75rem; font-weight: 700;
  }
  .chip.yes { color: var(--accent); border-color: var(--accent); }
  .chip.no  { color: var(--text); }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border);
    font-size: 0.75rem; font-weight: 600;
  }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.proposed { color: var(--ok); }
  .badge.already_priced { color: var(--warn); }
  .badge.no_signal { color: var(--none); }
  .badge.stake_too_small { color: var(--none); }

  .bars { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .bar-row { display: grid; grid-template-columns: 240px 1fr 70px; gap: 12px; align-items: center; margin-bottom: 10px; }
  .bar-row:last-of-type { margin-bottom: 0; }
  .bar-label { color: var(--muted); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { position: relative; height: 12px; }
  .bar-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px;
  }
  .bar-val { color: var(--text); font-size: 0.82rem; text-align: right; font-variant-numeric: tabular-nums; }
  .bars .note { color: var(--muted); font-size: 0.8rem; margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }

  .empty-state, .error-state {
    background: var(--panel); border: 1px dashed var(--border); border-radius: 10px;
    padding: 24px; color: var(--muted); font-size: 0.9rem;
  }
  .error-state code { background: var(--panel-2); padding: 2px 6px; border-radius: 5px; font-size: 0.82rem; }
  footer { margin-top: 40px; color: var(--none); font-size: 0.78rem; }
  @media (max-width: 640px) { .bar-row { grid-template-columns: 1fr 60px; } .bar-label { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prediction Desk<span class="dot">.</span></h1>
    <a class="back" href="../">&larr; hub</a>
  </header>
  <p class="tagline">Cross-venue shadow pipeline &mdash; Polymarket flow read-only, execution proposals for Kalshi. Mock data.</p>
  <p class="meta" id="meta">loading&hellip;</p>

  <div id="content"></div>

  <footer>Every proposal requires human approval &mdash; nothing auto-executes. Regenerate with <span class="ticker">python3 mock_pipeline.py</span>.</footer>
</div>

<script>
  const fmtUsd = n => "$" + Number(n).toLocaleString(undefined, {maximumFractionDigits: 2});
  const fmtSecs = s => s >= 90 ? (s/60).toFixed(1) + "m" : s.toFixed(1) + "s";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  const STATUS_LABEL = {
    proposed: "proposed",
    already_priced: "skipped — already priced",
    no_signal: "no signal",
    stake_too_small: "skipped — stake too small",
  };

  function sideChip(side) {
    return `<span class="chip ${side}">${side.toUpperCase()}</span>`;
  }

  function render(d) {
    const totalStake = d.proposals.reduce((a, p) => a + p.stake, 0);
    const liveTotal = d.timings.reduce((a, t) => a + t.live_s, 0);
    const mockTotal = d.timings.reduce((a, t) => a + t.mock_ms, 0);

    document.getElementById("meta").textContent =
      `Run ${new Date(d.generated_at).toLocaleString()} · bankroll ${fmtUsd(d.params.bankroll)} · ` +
      `shadow cap ${(d.params.shadow_cap_pct*100).toFixed(0)}%/trade · quarter-Kelly · ` +
      `filters: z ≥ ${d.params.min_signal_z}, edge ≥ ${(d.params.min_edge*100).toFixed(0)}c`;

    const tiles = `
      <div class="tiles">
        <div class="tile"><div class="label">Proposals</div><div class="value">${d.proposals.length}</div><div class="sub">of ${d.signals.length} mapped markets</div></div>
        <div class="tile"><div class="label">Total staked</div><div class="value">${fmtUsd(totalStake)}</div><div class="sub">pending your approval</div></div>
        <div class="tile"><div class="label">Cycle, live APIs</div><div class="value">~${fmtSecs(liveTotal)}</div><div class="sub">projected</div></div>
        <div class="tile"><div class="label">Cycle, this mock</div><div class="value">${mockTotal.toFixed(0)}ms</div><div class="sub">synthetic data</div></div>
      </div>`;

    const proposalRows = d.proposals.map(p => `
      <tr>
        <td class="ticker">${esc(p.ticker)}</td>
        <td>${sideChip(p.side)}</td>
        <td class="num stake">${fmtUsd(p.stake)}</td>
        <td class="num">${p.z}</td>
        <td class="num">${fmtUsd(p.sharp_usd)}</td>
        <td class="num">${p.pm.toFixed(2)}</td>
        <td class="num">${p.kalshi.toFixed(2)}</td>
        <td class="num">${(p.edge*100).toFixed(0)}c</td>
        <td class="event-cell">${esc(p.event)}</td>
      </tr>`).join("");

    const proposalsSection = d.proposals.length ? `
      <section>
        <h3>Trade proposals — approve on Kalshi</h3>
        <div class="tablewrap"><table>
          <thead><tr><th>Ticker</th><th>Side</th><th class="num">Stake</th><th class="num">Signal z</th><th class="num">Sharp flow</th><th class="num">PM</th><th class="num">Kalshi</th><th class="num">Edge</th><th>Event</th></tr></thead>
          <tbody>${proposalRows}</tbody>
        </table></div>
      </section>` : `
      <section>
        <h3>Trade proposals</h3>
        <div class="empty-state">No flow anomaly cleared both the signal and edge filters this cycle.</div>
      </section>`;

    const signalRows = d.signals
      .slice()
      .sort((a, b) => Math.abs(b.z) - Math.abs(a.z))
      .map(s => `
      <tr>
        <td class="ticker">${esc(s.ticker)}</td>
        <td><span class="badge ${s.status}">${STATUS_LABEL[s.status] || esc(s.status)}</span></td>
        <td class="num">${s.z}</td>
        <td class="num">${fmtUsd(s.sharp_usd)}</td>
        <td class="num">${s.pm.toFixed(2)}</td>
        <td class="num">${s.kalshi.toFixed(2)}</td>
        <td class="num">${(s.edge*100).toFixed(0)}c</td>
        <td class="event-cell">${esc(s.event)}</td>
      </tr>`).join("");

    const signalsSection = `
      <section>
        <h3>All mapped markets this cycle</h3>
        <div class="tablewrap"><table>
          <thead><tr><th>Ticker</th><th>Status</th><th class="num">Signal z</th><th class="num">Sharp flow</th><th class="num">PM</th><th class="num">Kalshi</th><th class="num">Edge</th><th>Event</th></tr></thead>
          <tbody>${signalRows}</tbody>
        </table></div>
      </section>`;

    const maxLive = Math.max(...d.timings.map(t => t.live_s), 1);
    const barRows = d.timings.map(t => `
      <div class="bar-row" title="${esc(t.stage)}: ~${fmtSecs(t.live_s)} live, ${t.mock_ms}ms in the mock">
        <div class="bar-label">${esc(t.stage.replace(/^\d+\.\s*/, ""))}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(1.5, t.live_s/maxLive*100)}%"></div></div>
        <div class="bar-val">~${fmtSecs(t.live_s)}</div>
      </div>`).join("");

    const runtimeSection = `
      <section>
        <h3>Projected runtime per stage — live APIs</h3>
        <div class="bars">
          ${barRows}
          <div class="note">One-time cold start (90-day wallet-history backfill): ~${d.cold_start.rest_hours}h via REST, ~${d.cold_start.bulk_minutes}m via subgraph/bulk export.</div>
        </div>
      </section>`;

    document.getElementById("content").innerHTML = tiles + proposalsSection + signalsSection + runtimeSection;
  }

  async function load() {
    try {
      const res = await fetch("./data/proposals.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      render(await res.json());
    } catch (err) {
      document.getElementById("meta").textContent = "";
      document.getElementById("content").innerHTML =
        `<div class="error-state">Couldn't load <code>data/proposals.json</code> (${esc(err.message)}).
         Run <code>python3 mock_pipeline.py</code> to generate it, and serve this folder over HTTP
         (e.g. <code>python3 -m http.server</code>) — <code>fetch</code> doesn't work from <code>file://</code>.</div>`;
    }
  }
  load();
</script>
</body>
</html>
