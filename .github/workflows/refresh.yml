name: Refresh data

# TEMPORARY (branch-only): repurposed to re-harvest Blitz history and take
# a week snapshot. Restore to the main version before merging.

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harvest league history
        run: python scripts/league_history.py --league "1387442990548549632" --slug "blitz"

      - name: Week snapshot
        run: python scripts/week_snapshot.py

      - name: Commit and push if changed
        run: |
          git config user.name "hub-bot"
          git config user.email "hub-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: blitz re-harvest + week snapshot" && git push)
