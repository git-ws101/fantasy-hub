name: League lookup

on:
  workflow_dispatch:
    inputs:
      username:
        description: Sleeper username to look up
        required: true
        default: ArtBlankBurner
      seasons:
        description: Comma-separated seasons
        required: false
        default: "2026,2025,2024"

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Look up leagues
        run: python scripts/league_lookup.py --username "${{ inputs.username }}" --seasons "${{ inputs.seasons }}"

      - name: Commit and push if changed
        run: |
          git config user.name "hub-bot"
          git config user.email "hub-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: league lookup for ${{ inputs.username }}" && git push)
