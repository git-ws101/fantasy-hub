name: League history

on:
  workflow_dispatch:
    inputs:
      league:
        description: Current league_id to walk back from
        required: true
      slug:
        description: Short name for the output file
        required: true

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harvest league history
        run: python scripts/league_history.py --league "${{ inputs.league }}" --slug "${{ inputs.slug }}"

      - name: Commit and push if changed
        run: |
          git config user.name "hub-bot"
          git config user.email "hub-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: league history for ${{ inputs.slug }}" && git push)
